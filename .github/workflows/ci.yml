name: CI
on:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README
        run: |
          echo "checking README..."
          if [ ! -s README.md ]; then
            echo "README.md is missing or empty" >&2
            exit 1
          fi
          head -n 1 README.md
